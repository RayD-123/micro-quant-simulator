name: Daily Auto Backtest

on:
  workflow_dispatch:
  schedule:
    # 纽约时间周一到周五的 24:00 (即 UTC 04:00 周二到周六)
    - cron: '0 4 * * 2-6'

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: 1. 检出回测仓代码
      uses: actions/checkout@v4
      
    - name: 临时权限检查
      run: |
        if [ -z "${{ secrets.MY_SYNC_TOKEN }}" ]; then
          echo "❌ 警告：机器人手里是空的，它没读到 Secret！"
          exit 1
        else
          echo "✅ 机器人拿到钥匙了（虽然我看不到内容，但它不是空的）。"
        fi
        
    - name: 2. 下载数据仓代码 (ZIP 模式)
      env:
        MY_TOKEN: ${{ secrets.MY_SYNC_TOKEN }}
      run: |
        echo "正在通过 API 下载数据仓 ZIP 包..."
        # 1. 下载 ZIP 包
        curl -L -H "Authorization: token $MY_TOKEN" \
          -o repo.zip \
          https://github.com/RayD-123/micro-quant-trading-lab-2/archive/refs/heads/field-6.0.zip
        
        # 2. 解压
        unzip repo.zip
        
        # 3. 把解压出来的文件夹重命名为 temp_data_repo，方便后续脚本读取
        # 注意：GitHub ZIP 解压出来的文件夹名通常是 仓库名-分支名
        mv micro-quant-trading-lab-2-field-6.0 temp_data_repo
        
        echo "✅ 下载并解压完成！"
        ls -la temp_data_repo
    
    - name: 3. 安装运行环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
    
    - name: 4. 安装必要插件
      run: pip install pandas yfinance numpy  # 确保包含回测所需库

    - name: 5. 执行同步并跑回测
      run: python sync_data.py

    - name: 6. 自动保存回测结果 (Equity CSV 等)
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "Auto-Backtest-Bot"
        # 确保 history_database 存在，否则 git add 会报错
        mkdir -p history_database
        git add history_database/
        git add daily_equity.csv || echo "No changes to daily_equity.csv"
        git commit -m "🤖 自动同步数据并更新回测报告 [$(date)]" || echo "No changes to commit"
        git push

name: Daily Auto Backtest

on:
  workflow_dispatch:
  schedule:
    # 纽约时间周一到周五的 24:00 (即 UTC 04:00 周二到周六)
    - cron: '0 4 * * 2-6'

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: 1. 检出回测仓代码
      uses: actions/checkout@v4

    - name: 2. 检出数据仓代码 (作为临时数据源)
      uses: actions/checkout@v4
      with:
        # 这里指向你的数据仓
        repository: RayD-123/micro-quant-trading-lab-2
        path: temp_data_repo
        # --- 这里的钥匙指向你在 Secrets 里存的 MY_SYNC_TOKEN ---
        token: ${{ secrets.MY_SYNC_TOKEN }}

    - name: 3. 安装运行环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
    
    - name: 4. 安装必要插件
      run: pip install pandas yfinance numpy  # 这里加上回测需要的库

    - name: 5. 执行同步并跑回测
      run: python sync_data.py

    - name: 6. 自动保存回测结果 (Equity CSV 等)
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "Auto-Backtest-Bot"
        # 如果 history_database 文件夹不存在则创建
        mkdir -p history_database
        git add history_database/
        git add daily_equity.csv || echo "No changes to daily_equity.csv"
        git commit -m "🤖 自动同步数据并更新回测报告 [$(date)]" || echo "No changes to commit"
        git push

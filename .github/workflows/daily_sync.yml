name: Daily Auto Backtest

on:
  workflow_dispatch:
  schedule:
    # 纽约时间周一到周五的 24:00 (即 UTC 04:00 周二到周六)
    - cron: '0 4 * * 2-6'

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: 1. 检出回测仓代码
      uses: actions/checkout@v4

    - name: 2. 检出数据仓代码 (公开仓免密模式)
      run: |
        echo "正在清理并准备环境..."
        rm -rf temp_data_repo
        
        echo "开始克隆数据仓..."
        # 数据仓已转为 Public，直接克隆，无需 Token
        git clone --depth 1 --branch field-6.0 https://github.com/RayD-123/micro-quant-trading-lab-2.git temp_data_repo
        
        echo "检查克隆结果..."
        ls -la temp_data_repo

    - name: 3. 安装运行环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: 4. 安装必要插件
      run: pip install pandas yfinance numpy matplotlib seaborn tabulate

    - name: 5. 执行同步并跑回测
      run: python sync_data.py

    - name: 6. 生成可视化业绩图表
      run: python visualizer.py

    - name: 7. 自动保存回测结果 (Equity CSV 及图表等)
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "Auto-Backtest-Bot"
        
        mkdir -p history_database
        
        git add history_database/
        git add daily_equity.csv || echo "No changes to daily_equity.csv"
        git add *.png || echo "No changes to images"
        
        git commit -m "🤖 自动同步数据并更新回测报告 [$(date)]" || echo "No changes to commit"
        git push

name: Daily Auto Backtest

on:
  workflow_dispatch:
  schedule:
    # 纽约时间周一到周五的 24:00 (即 UTC 04:00 周二到周六)
    - cron: '0 4 * * 2-6'

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: 1. 检出回测仓代码
      uses: actions/checkout@v4
      
    - name: 临时权限检查
      run: |
        if [ -z "${{ secrets.MY_SYNC_TOKEN }}" ]; then
          echo "❌ 警告：机器人手里是空的，它没读到 Secret！"
          exit 1
        else
          echo "✅ 机器人拿到钥匙了（虽然我看不到内容，但它不是空的）。"
        fi
        
    - name: 2. 检出数据仓代码 (稳定版认证)
      env:
        MY_TOKEN: ${{ secrets.MY_SYNC_TOKEN }}
      run: |
        echo "正在清理并准备环境..."
        rm -rf temp_data_repo
        
        # ⚠️ 核心操作：通过 Git 全局配置，把 Token 强行注入所有 github.com 的请求
        git config --global url."https://x-access-token:${MY_TOKEN}@github.com/".insteadOf "https://github.com/"
        
        echo "开始克隆数据仓..."
        git clone --depth 1 --branch field-6.0 https://github.com/RayD-123/micro-quant-trading-lab-2.git temp_data_repo
        
        echo "检查克隆结果..."
        ls -la temp_data_repo
    
    - name: 3. 安装运行环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
    
  - name: 4. 安装所有必要库
      run: |
        pip install pandas yfinance numpy matplotlib seaborn tabulate

    - name: 5. 执行同步并跑回测
      run: python sync_data.py

    - name: 6. 生成可视化业绩图表
      run: python visualizer.py  # 运行画图脚本

    - name: 7. 自动保存回测结果与图表
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action Bot"
        
        # 确保包含 csv、历史数据库和新生成的 png 图片
        git add daily_equity.csv history_database/ *.png
        
        # 即使图片没变化也不报错
        git commit -m "📊 [Auto] Update Daily Backtest Results & Charts" || exit 0
        git push

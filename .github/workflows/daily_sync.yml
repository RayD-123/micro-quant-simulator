name: Daily Auto Backtest

on:
  workflow_dispatch:
  schedule:
    # 纽约时间周一到周五的 24:00 (即 UTC 04:00 周二到周六)
    - cron: '0 4 * * 2-6'

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: 1. 检出回测仓代码
      uses: actions/checkout@v4
      
    - name: 临时权限检查
      run: |
        if [ -z "${{ secrets.MY_SYNC_TOKEN }}" ]; then
          echo "❌ 警告：机器人手里是空的，它没读到 Secret！"
          exit 1
        else
          echo "✅ 机器人拿到钥匙了（虽然我看不到内容，但它不是空的）。"
        fi
        
    - name: 2. 暴力检出数据仓 (原生 Git 模式)
      env:
        # 显式把钥匙转为环境变量
        MY_TOKEN: ${{ secrets.MY_SYNC_TOKEN }}
      run: |
        echo "正在清理旧目录..."
        rm -rf temp_data_repo
        
        echo "开始克隆数据仓..."
        # ⚠️ 注意这里：我们把 Token 直接塞进 URL，这是最硬核的认证方式
        git clone --depth 1 --branch field-6.0 https://x-access-token:${MY_TOKEN}@github.com/github.com/RayD-123/micro-quant-trading-lab-2.git temp_data_repo
        
        echo "检查克隆结果..."
        ls -la temp_data_repo
    
    - name: 3. 安装运行环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
    
    - name: 4. 安装必要插件
      run: pip install pandas yfinance numpy  # 确保包含回测所需库

    - name: 5. 执行同步并跑回测
      run: python sync_data.py

    - name: 6. 自动保存回测结果 (Equity CSV 等)
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "Auto-Backtest-Bot"
        # 确保 history_database 存在，否则 git add 会报错
        mkdir -p history_database
        git add history_database/
        git add daily_equity.csv || echo "No changes to daily_equity.csv"
        git commit -m "🤖 自动同步数据并更新回测报告 [$(date)]" || echo "No changes to commit"
        git push

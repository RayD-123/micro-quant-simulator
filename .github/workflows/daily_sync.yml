name: Daily Auto Backtest

on:
  workflow_dispatch:
  schedule:
    # 纽约时间周一到周五的 24:00 (即 UTC 04:00 周二到周六)
    - cron: '0 4 * * 2-6'

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: 1. 检出回测仓代码
      uses: actions/checkout@v4

    - name: 2. 检出数据仓代码 (作为临时数据源)
      uses: actions/checkout@v4
      with:
        # ⚠️ 请务必把下面的名字改成你自己的 GitHub 用户名/仓库名
        repository: micro-quant-simulator/micro-quant-trading-lab-2-field-6.0
        path: temp_data_repo

    - name: 3. 安装运行环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
    
    - name: 4. 安装必要插件
      run: pip install pandas yfinance numpy  # 这里加上回测需要的库

    - name: 5. 执行同步并跑回测
      run: python sync_data.py

    - name: 6. 自动保存回测结果 (Equity CSV 等)
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "Auto-Backtest-Bot"
        git add history_database/
        git add daily_equity.csv || echo "No equity file"
        git commit -m "📊 自动化更新：同步数据并更新回测净值 (纽约时间午夜版)" || echo "Nothing to commit"
        git push
